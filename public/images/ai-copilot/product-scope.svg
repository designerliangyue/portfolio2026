<svg viewBox="0 0 1184 1080" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .ttl{font-family:Georgia,'Times New Roman',serif;font-weight:400;fill:#292219;}
      .hd{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:650;fill:#292219;}
      .bd{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;fill:#665d50;}
      .muted{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8d8270;}
      .lbl{font-family:'SF Mono',Menlo,ui-monospace,monospace;letter-spacing:0.14em;fill:#a39781;}
      .num{font-family:'SF Mono',Menlo,ui-monospace,monospace;font-weight:700;fill:#b6552f;}
      .step{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;fill:#332b1f;}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6552f"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cfc5b3"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1183" height="1079" rx="20" fill="#fffdf8" stroke="#e5ddca"/>

  <rect x="64" y="46" width="28" height="3" fill="#b6552f"/>
  <text x="64" y="84" class="ttl" font-size="25">Scope and phases</text>
  <text x="64" y="116" class="bd" font-size="14">North star: strengthen the agent’s WhatsApp sales habit first, then connect quote, close, and feedback into one path.</text>

  <text x="64" y="168" class="lbl" font-size="10">PHASED MVP</text>
  <text x="64" y="194" class="hd" font-size="16">Four phases, from lead support to a measurable sales loop</text>

  <rect x="64" y="224" width="252" height="168" rx="16" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="88" y="258" class="num" font-size="13">01</text>
  <text x="88" y="286" class="ttl" font-size="17">Content &amp; hand-off</text>
  <text x="88" y="318" class="bd" font-size="13">Generate posters, cards, and</text>
  <text x="88" y="340" class="bd" font-size="13">deep links into private chat.</text>
  <text x="88" y="368" class="muted" font-size="12">Goal: smoother lead entry.</text>

  <line x1="318" y1="308" x2="328" y2="308" stroke="#cfc5b3" stroke-width="2" marker-end="url(#arrowSoft)"/>

  <rect x="332" y="224" width="252" height="168" rx="16" fill="#fff8ef" stroke="#d7835f" stroke-width="1.5"/>
  <text x="356" y="258" class="num" font-size="13">02</text>
  <text x="356" y="286" class="ttl" font-size="17">Conversational quoting</text>
  <text x="356" y="318" class="bd" font-size="13">Agents quote through natural</text>
  <text x="356" y="340" class="bd" font-size="13">language without app switching.</text>
  <text x="356" y="368" class="muted" font-size="12">Goal: reduce context switching.</text>

  <line x1="586" y1="308" x2="596" y2="308" stroke="#cfc5b3" stroke-width="2" marker-end="url(#arrowSoft)"/>

  <rect x="600" y="224" width="252" height="168" rx="16" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="624" y="258" class="num" font-size="13">03</text>
  <text x="624" y="286" class="ttl" font-size="17">Agent-assisted close</text>
  <text x="624" y="318" class="bd" font-size="13">High-stakes steps remain gated</text>
  <text x="624" y="340" class="bd" font-size="13">by the agent via secure links.</text>
  <text x="624" y="368" class="muted" font-size="12">Goal: preserve trust and control.</text>

  <line x1="854" y1="308" x2="864" y2="308" stroke="#cfc5b3" stroke-width="2" marker-end="url(#arrowSoft)"/>

  <rect x="868" y="224" width="252" height="168" rx="16" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="892" y="258" class="num" font-size="13">04</text>
  <text x="892" y="286" class="ttl" font-size="17">Signals &amp; results</text>
  <text x="892" y="318" class="bd" font-size="13">Turn passive links into</text>
  <text x="892" y="340" class="bd" font-size="13">moments for agent follow-up.</text>
  <text x="892" y="368" class="muted" font-size="12">Goal: keep improving the loop.</text>

  <line x1="64" y1="446" x2="1120" y2="446" stroke="#eae2cf"/>

  <text x="64" y="494" class="lbl" font-size="10">USER FLOW</text>
  <text x="64" y="520" class="hd" font-size="16">Lead to policy issued: move key actions back into WhatsApp</text>

  <g font-size="10" font-family="'SF Mono',Menlo,monospace" letter-spacing="0.1em">
    <rect x="828" y="492" width="11" height="11" rx="2" fill="#f1ebdc" stroke="#ddd4bf"/>
    <text x="844" y="501" fill="#6f6659">SYSTEM / WABA</text>
    <rect x="960" y="492" width="11" height="11" rx="2" fill="#f7e8dd" stroke="#d9a98f"/>
    <text x="976" y="501" fill="#6f6659">AGENT</text>
    <rect x="1038" y="492" width="11" height="11" rx="2" fill="#fffdf8" stroke="#cfc5ac" stroke-dasharray="2.5 2"/>
    <text x="1054" y="501" fill="#6f6659">CUSTOMER</text>
  </g>

  <rect x="64" y="560" width="1056" height="118" rx="18" fill="#fbf7ef" stroke="#e5ddca"/>
  <text x="92" y="598" class="lbl" font-size="10">01 LEAD</text>
  <rect x="228" y="586" width="248" height="54" rx="12" fill="#f7e8dd" stroke="#d9a98f"/>
  <text x="352" y="618" text-anchor="middle" class="step" font-size="13">Agent requests lead support</text>
  <line x1="486" y1="613" x2="552" y2="613" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="562" y="586" width="248" height="54" rx="12" fill="#f1ebdc" stroke="#ddd4bf"/>
  <text x="686" y="618" text-anchor="middle" class="step" font-size="13">WABA generates assets</text>
  <line x1="820" y1="613" x2="886" y2="613" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="896" y="586" width="184" height="54" rx="12" fill="#fffdf8" stroke="#cfc5ac" stroke-dasharray="4 3"/>
  <text x="988" y="618" text-anchor="middle" class="step" font-size="13">Customer clicks</text>

  <rect x="64" y="706" width="1056" height="118" rx="18" fill="#fbf7ef" stroke="#e5ddca"/>
  <text x="92" y="744" class="lbl" font-size="10">02 ADVISE</text>
  <rect x="228" y="732" width="350" height="54" rx="12" fill="#f7e8dd" stroke="#d9a98f"/>
  <text x="403" y="764" text-anchor="middle" class="step" font-size="13">Agent consults with customer in private chat</text>
  <line x1="588" y1="759" x2="654" y2="759" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="664" y="732" width="350" height="54" rx="12" fill="#f7e8dd" stroke="#d9a98f"/>
  <text x="839" y="764" text-anchor="middle" class="step" font-size="13">Agent gets quote through WABA</text>

  <rect x="64" y="852" width="1056" height="154" rx="18" fill="#fbf7ef" stroke="#e5ddca"/>
  <text x="92" y="890" class="lbl" font-size="10">03 CLOSE + SIGNALS</text>
  <rect x="228" y="878" width="212" height="54" rx="12" fill="#f1ebdc" stroke="#ddd4bf"/>
  <text x="334" y="910" text-anchor="middle" class="step" font-size="13">Quote + secure link</text>
  <line x1="450" y1="905" x2="506" y2="905" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516" y="878" width="182" height="54" rx="12" fill="#f7e8dd" stroke="#d9a98f"/>
  <text x="607" y="910" text-anchor="middle" class="step" font-size="13">Agent forwards</text>
  <line x1="708" y1="905" x2="764" y2="905" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="774" y="878" width="144" height="54" rx="12" fill="#fffdf8" stroke="#cfc5ac" stroke-dasharray="4 3"/>
  <text x="846" y="910" text-anchor="middle" class="step" font-size="13">Customer applies</text>
  <line x1="928" y1="905" x2="984" y2="905" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="994" y="878" width="82" height="54" rx="12" fill="#292219"/>
  <text x="1035" y="910" text-anchor="middle" fill="#fffdf8" font-size="13" font-weight="700">Issued</text>
  <rect x="228" y="948" width="848" height="34" rx="10" fill="#fff8ef" stroke="#d7835f"/>
  <text x="652" y="970" text-anchor="middle" class="bd" font-size="12.5">Click, form, and close signals sync back to WABA for agent follow-up and performance inquiry.</text>
</svg>
