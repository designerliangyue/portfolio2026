<svg viewBox="0 0 1184 1040" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .ttl{font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-weight:600;fill:#292219;}
      .hd{font-family:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;font-weight:650;fill:#292219;}
      .bd{font-family:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;fill:#665d50;}
      .muted{font-family:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;fill:#8d8270;}
      .lbl{font-family:'SF Mono',Menlo,ui-monospace,'PingFang SC',monospace;letter-spacing:0.14em;fill:#a39781;}
      .num{font-family:'SF Mono',Menlo,ui-monospace,monospace;font-weight:700;fill:#b6552f;}
      .chip{font-family:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;font-weight:600;fill:#332b1f;}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6552f"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1183" height="1039" rx="20" fill="#fffdf8" stroke="#e5ddca"/>

  <rect x="64" y="46" width="28" height="3" fill="#b6552f"/>
  <text x="64" y="84" class="ttl" font-size="25">四层设计转译</text>
  <text x="64" y="116" class="bd" font-size="14">设计目标：把多渠道与复杂保险服务，收敛成代理人可理解、可执行的一致体验。</text>

  <rect x="64" y="158" width="1056" height="92" rx="18" fill="#fff8ef" stroke="#d7835f" stroke-width="1.5"/>
  <text x="92" y="194" class="lbl" font-size="10">AGENT TASK</text>
  <text x="92" y="224" class="hd" font-size="18">“我需要报价、跟进客户，或查看业绩。”</text>
  <text x="1092" y="212" text-anchor="end" class="muted" font-size="13">自然语言任务，而不是系统菜单</text>

  <line x1="592" y1="250" x2="592" y2="288" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="64" y="330" class="lbl" font-size="10">DESIGN TRANSLATION LAYERS</text>

  <rect x="64" y="360" width="252" height="222" rx="18" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="92" y="398" class="num" font-size="13">01</text>
  <text x="92" y="428" class="ttl" font-size="18">熟悉入口</text>
  <text x="92" y="462" class="bd" font-size="13">让代理人从已有工作渠道进入，</text>
  <text x="92" y="484" class="bd" font-size="13">不需要学习新的系统入口。</text>
  <rect x="92" y="516" width="82" height="30" rx="8" fill="#fffdf8" stroke="#e5ddca"/>
  <text x="133" y="536" text-anchor="middle" class="chip" font-size="12">WhatsApp</text>
  <rect x="184" y="516" width="50" height="30" rx="8" fill="#fffdf8" stroke="#e5ddca"/>
  <text x="209" y="536" text-anchor="middle" class="chip" font-size="12">Line</text>
  <rect x="244" y="516" width="44" height="30" rx="8" fill="#fffdf8" stroke="#e5ddca"/>
  <text x="266" y="536" text-anchor="middle" class="chip" font-size="12">Zalo</text>

  <rect x="332" y="360" width="252" height="222" rx="18" fill="#fff8ef" stroke="#d7835f" stroke-width="1.5"/>
  <text x="360" y="398" class="num" font-size="13">02</text>
  <text x="360" y="428" class="ttl" font-size="18">上下文对话</text>
  <text x="360" y="462" class="bd" font-size="13">系统理解代理人想做什么，</text>
  <text x="360" y="484" class="bd" font-size="13">并保留销售过程中的上下文。</text>
  <text x="360" y="524" class="lbl" font-size="10">INTENT · MEMORY · STATE</text>

  <rect x="600" y="360" width="252" height="222" rx="18" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="628" y="398" class="num" font-size="13">03</text>
  <text x="628" y="428" class="ttl" font-size="18">引导式操作</text>
  <text x="628" y="462" class="bd" font-size="13">把复杂保险流程拆成明确、</text>
  <text x="628" y="484" class="bd" font-size="13">可执行、可确认的步骤。</text>
  <text x="628" y="524" class="lbl" font-size="10">QUOTE · APPLICATION · PAYMENT</text>

  <rect x="868" y="360" width="252" height="222" rx="18" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="896" y="398" class="num" font-size="13">04</text>
  <text x="896" y="428" class="ttl" font-size="18">服务编排</text>
  <text x="896" y="462" class="bd" font-size="13">把后端能力包装成代理人</text>
  <text x="896" y="484" class="bd" font-size="13">能理解的任务和反馈。</text>
  <text x="896" y="524" class="lbl" font-size="10">PRODUCT · POLICY · CUSTOMER</text>

  <line x1="592" y1="582" x2="592" y2="620" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="650" width="1056" height="136" rx="18" fill="#fff8ef" stroke="#d7835f" stroke-width="1.5"/>
  <text x="92" y="688" class="lbl" font-size="10">EXPERIENCE OUTPUT</text>
  <text x="92" y="722" class="hd" font-size="20">一个一致的 WhatsApp 副驾驶体验</text>
  <text x="92" y="752" class="bd" font-size="13.5">代理人看到的是清晰任务；系统复杂度被隐藏在体验层之后。</text>
  <g>
    <rect x="720" y="680" width="150" height="34" rx="10" fill="#fffdf8" stroke="#e5ddca"/>
    <text x="795" y="702" text-anchor="middle" class="chip" font-size="12">报价</text>
    <rect x="890" y="680" width="150" height="34" rx="10" fill="#fffdf8" stroke="#e5ddca"/>
    <text x="965" y="702" text-anchor="middle" class="chip" font-size="12">投保填单</text>
    <rect x="720" y="728" width="150" height="34" rx="10" fill="#fffdf8" stroke="#e5ddca"/>
    <text x="795" y="750" text-anchor="middle" class="chip" font-size="12">客户跟进</text>
    <rect x="890" y="728" width="150" height="34" rx="10" fill="#fffdf8" stroke="#e5ddca"/>
    <text x="965" y="750" text-anchor="middle" class="chip" font-size="12">业绩查询</text>
  </g>

  <text x="64" y="884" class="lbl" font-size="10">TECHNICAL FOUNDATION</text>
  <text x="64" y="910" class="hd" font-size="16">技术只作为支撑：多渠道网关、LLM 编排、MCP 路由与业务服务</text>
  <rect x="64" y="944" width="240" height="48" rx="12" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="184" y="974" text-anchor="middle" class="chip" font-size="13">Omni-channel gateway</text>
  <rect x="324" y="944" width="240" height="48" rx="12" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="444" y="974" text-anchor="middle" class="chip" font-size="13">LLM orchestration</text>
  <rect x="584" y="944" width="240" height="48" rx="12" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="704" y="974" text-anchor="middle" class="chip" font-size="13">MCP routing</text>
  <rect x="844" y="944" width="276" height="48" rx="12" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="982" y="974" text-anchor="middle" class="chip" font-size="13">Insurance services</text>
</svg>
