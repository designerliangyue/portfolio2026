<svg viewBox="0 0 1184 596" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .ttl{font-family:Georgia,'Times New Roman',serif;font-weight:400;fill:#292219;}
      .hd{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:650;fill:#292219;}
      .bd{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;fill:#665d50;}
      .muted{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8d8270;}
      .lbl{font-family:'SF Mono',Menlo,ui-monospace,monospace;letter-spacing:0.14em;fill:#a39781;}
      .num{font-family:'SF Mono',Menlo,ui-monospace,monospace;fill:#b6552f;font-weight:700;}
      .callout{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;fill:#b6552f;}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6552f"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cfc5b3"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1183" height="595" rx="20" fill="#fffdf8" stroke="#e5ddca"/>

  <rect x="64" y="46" width="28" height="3" fill="#b6552f"/>
  <text x="64" y="84" class="ttl" font-size="25">Sales happen in WhatsApp. Product capability should meet agents there.</text>
  <text x="64" y="116" class="bd" font-size="14">The core problem was not quote generation itself, but forcing agents to leave the trusted chat context.</text>

  <text x="64" y="170" class="lbl" font-size="10">CURRENT JOURNEY</text>
  <text x="64" y="196" class="hd" font-size="16">Today: trust and transaction are split apart</text>

  <rect x="64" y="222" width="260" height="96" rx="14" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="88" y="254" class="num" font-size="13">01</text>
  <text x="88" y="280" class="hd" font-size="15">Acquire leads in WhatsApp</text>
  <text x="88" y="304" class="muted" font-size="12.5">Trust is built inside the chat</text>

  <line x1="334" y1="270" x2="394" y2="270" stroke="#cfc5b3" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <rect x="404" y="210" width="372" height="120" rx="16" fill="#fff8ef" stroke="#d7835f" stroke-width="1.5"/>
  <text x="428" y="244" class="callout" font-size="13">FRICTION POINT</text>
  <text x="428" y="272" class="hd" font-size="16">Switch to Ignite to quote / apply</text>
  <text x="428" y="298" class="bd" font-size="13">The sales rhythm breaks and agents must rebuild context.</text>

  <line x1="786" y1="270" x2="846" y2="270" stroke="#cfc5b3" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <rect x="856" y="222" width="264" height="96" rx="14" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="880" y="254" class="num" font-size="13">03</text>
  <text x="880" y="280" class="hd" font-size="15">Return to WhatsApp</text>
  <text x="880" y="304" class="muted" font-size="12.5">Customer signals become scattered</text>

  <line x1="64" y1="370" x2="1120" y2="370" stroke="#eae2cf"/>

  <text x="64" y="414" class="lbl" font-size="10">DESIGN DIRECTION</text>
  <text x="64" y="440" class="hd" font-size="16">New path: embed quote-to-issue back into the chat</text>

  <rect x="64" y="466" width="232" height="74" rx="14" fill="#f6f1e7" stroke="#e5ddca"/>
  <text x="88" y="496" class="hd" font-size="14">WhatsApp conversation</text>
  <text x="88" y="520" class="muted" font-size="12.5">Keep agent trust intact</text>
  <line x1="306" y1="503" x2="362" y2="503" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="372" y="466" width="232" height="74" rx="14" fill="#fff8ef" stroke="#d7835f" stroke-width="1.5"/>
  <text x="396" y="496" class="hd" font-size="14">AI-assisted quote</text>
  <text x="396" y="520" class="muted" font-size="12.5">Conversation understands needs</text>
  <line x1="614" y1="503" x2="670" y2="503" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="466" width="232" height="74" rx="14" fill="#fff8ef" stroke="#d7835f" stroke-width="1.5"/>
  <text x="704" y="496" class="hd" font-size="14">WABA Flow application</text>
  <text x="704" y="520" class="muted" font-size="12.5">Structured UI captures key inputs</text>
  <line x1="922" y1="503" x2="978" y2="503" stroke="#b6552f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="988" y="466" width="132" height="74" rx="14" fill="#b6552f"/>
  <text x="1054" y="497" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="700">Issue / follow up</text>
  <text x="1054" y="521" text-anchor="middle" fill="#f6e2d5" font-size="12">Signals return</text>
</svg>
